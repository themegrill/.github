# TEMPLATE -- copy into a consuming repo as .github/workflows/pr-build-zip.yml
# and adjust build-command / zip-glob / branches to that repo's tooling.
name: Build Testable ZIP

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]
  workflow_dispatch:

jobs:
  zip:
    uses: themegrill/.github/.github/workflows/pr-build-zip.yml@master
    with:
      node-version: '20.x'
      php-version: '7.4'
      build-command: yarn build && yarn build:blocks && gulp release
      zip-glob: 'release/*.zip'
      artifacts-bucket: themegrill-pr-artifacts
      public-base-url: https://themegrill-pr-artifacts.s3.amazonaws.com
      s3-region: us-east-1
      # For Cloudflare R2, use instead:
      # s3-endpoint: https://<account-id>.r2.cloudflarestorage.com
      # s3-region: auto
      #
      # For a repo whose single build produces two distinct distributables
      # from the same tree (e.g. a Free+Pro pair), add labels plus a second
      # build/glob -- both zips land in the SAME PR comment (only one comment
      # is ever posted per PR, so a second `uses:` block of this workflow
      # would just clobber the first's comment instead of adding to it):
      # label: Free
      # extra-build-command: bash bin/dist.sh pro
      # extra-zip-glob: 'artifact/allcoach-pro-*.zip'
      # extra-label: Pro
    secrets: inherit
