# QA review of a PR, requested by adding tg-autopilot as a reviewer.
#
# Front door: n8n receives GitHub's pull_request `review_requested` webhook,
# pre-filters it, and fires repository_dispatch `qa-review` here (same bridge
# pattern as crisp-investigate-now.yml). workflow_dispatch is the manual
# fallback: GitHub never retries a failed webhook delivery, so if n8n was down
# when a review was requested, re-run it by hand.
#
# The dispatch payload is UNTRUSTED (anyone who finds the n8n URL, or holds a
# dispatch token, can send anything). The gate job re-verifies everything
# against the live GitHub API; nothing after it reads the payload again.
# Untrusted values only ever reach scripts through `env:`, never through
# `${{ }}` interpolation into a shell line.
#
# Design: QA-REVIEW.md (to be added). Pilot repo: themegrill/user-registration-pro,
# see config/qa-review-repos.json.
name: QA review

on:
  repository_dispatch:
    types: [qa-review]
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/name, must be listed in config/qa-review-repos.json"
        required: true
        type: string
      pr:
        description: "Pull request number"
        required: true
        type: string
      head_sha:
        description: "Optional: refuse to run unless the PR head is exactly this commit"
        required: false
        type: string
        default: ""
      post_comment:
        description: "Post/update the sticky PR comment (off by default so manual tests stay silent)"
        required: false
        type: boolean
        default: false

# Never cancel: a denied or duplicate request must not kill a good in-flight
# review. GitHub keeps at most one pending run per group (the newest).
concurrency:
  group: qa-review-${{ github.event.client_payload.repo || inputs.repo }}-${{ github.event.client_payload.pr || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QA_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
  QA_PR: ${{ github.event.client_payload.pr || inputs.pr }}
  # For a manual run the requester is whoever clicked "Run workflow".
  QA_REQUESTER: ${{ github.event.client_payload.requester || github.actor }}
  POST_COMMENT: ${{ github.event_name == 'repository_dispatch' || inputs.post_comment }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    env:
      # What the requester SAW; the gate refuses if the PR head has moved on.
      QA_HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      # Each PAT is scoped to one org; the scripts pick by the repo's owner.
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_TOKEN_THEMEGRILL: ${{ secrets.BOT_TOKEN_THEMEGRILL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gate (allowlist, PR state, same-repo, head sha, requester permission)
        id: gate
        run: node scripts/qa-review-gate.mjs

      - name: Summarize gate result
        if: always()
        env:
          ALLOWED: ${{ steps.gate.outputs.allowed }}
          CODE: ${{ steps.gate.outputs.code }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          {
            echo "### QA review gate"
            echo
            echo "- Repo: \`$QA_REPO\` PR: \`$QA_PR\` requester: \`$QA_REQUESTER\`"
            echo "- Allowed: \`${ALLOWED:-error}\` (\`${CODE:-n/a}\`)"
            echo "- Reason: ${REASON:-gate step failed before deciding; see its log}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only a permission denial is worth a PR comment (the requester would
      # otherwise see nothing). Other denials (draft, stale, fork...) just log.
      - name: Tell the requester they lack access
        if: steps.gate.outputs.allowed == 'false' && steps.gate.outputs.notify == 'true' && env.POST_COMMENT == 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          printf '%s\n' "QA review not started: $REASON" > body.md
          node scripts/qa-review-comment.mjs "$QA_REPO" "$QA_PR" body.md

  # Read-only review: never checks out or runs PR code, only reads the diff and
  # the product's .themegrill-qa/ data through the API (see qa-review-run.mjs),
  # so it is safe for this job to hold the OpenAI key and the bot tokens.
  # Complements, does not replace, the repo's own PHPCS / security / claudegrill
  # E2E checks: it reads their results and does not re-run them.
  review:
    name: Review
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      QA_BODY_OUT: ${{ github.workspace }}/qa-review-body.md
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_TOKEN_THEMEGRILL: ${{ secrets.BOT_TOKEN_THEMEGRILL }}
      # openai-client.mjs reads these two names.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLASSIFY_MODEL: ${{ vars.QA_REVIEW_MODEL || 'gpt-5.4-mini' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Feedback for the reviewer right away: a dispatch run is otherwise
      # invisible from the PR. Replaced in place by the result below.
      - name: Post "in progress" comment
        if: env.POST_COMMENT == 'true'
        run: |
          printf '%s\n' \
            "**QA review started** by @$QA_REQUESTER for \`${QA_HEAD_SHA:0:7}\`. Results will replace this comment. Run: $RUN_URL" \
            > progress.md
          node scripts/qa-review-comment.mjs "$QA_REPO" "$QA_PR" progress.md

      - name: Review
        id: review
        run: node scripts/qa-review-run.mjs

      # THIS repo is public, so its run summaries and logs are public. A review
      # of a private repo's code must never be written there; it is only posted
      # to the PR itself (post_comment). Only an explicit "false" counts as public.
      - name: Show result in the run summary (public target repos only)
        if: steps.review.outcome == 'success' && steps.review.outputs.repo_private == 'false'
        # tee: also in the job log, which (unlike the summary) can be read via the API/CLI.
        run: tee -a "$GITHUB_STEP_SUMMARY" < "$QA_BODY_OUT"

      - name: Note that the result is withheld from the run summary
        if: steps.review.outcome == 'success' && steps.review.outputs.repo_private != 'false'
        run: |
          echo "Review generated but NOT shown here: the target repo is private (or its visibility is unknown) and this run's summary is public. Re-run with post_comment=true to post it on the PR." >> "$GITHUB_STEP_SUMMARY"

      - name: Post result
        if: steps.review.outcome == 'success' && env.POST_COMMENT == 'true'
        run: node scripts/qa-review-comment.mjs "$QA_REPO" "$QA_PR" "$QA_BODY_OUT"

      # Don't leave "started" hanging forever. Static text only: no model or
      # PR-controlled content goes into a failure notice.
      - name: Replace "in progress" with a failure notice
        if: failure() && env.POST_COMMENT == 'true'
        run: |
          printf '%s\n' \
            "**QA review failed** for \`${QA_HEAD_SHA:0:7}\`. No findings were produced. Details: $RUN_URL" \
            > failed.md
          node scripts/qa-review-comment.mjs "$QA_REPO" "$QA_PR" failed.md
